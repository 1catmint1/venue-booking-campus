name: Isolated application latency comparison
on:
  workflow_dispatch:
    inputs:
      run:
        required: true
        type: string
      prepared:
        required: true
        type: string
      until:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: venue-isolated-latency-comparison
  cancel-in-progress: false
jobs:
  producer:
    if: github.repository == '1catmint1/venue-booking-campus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run isolated actual application cases up to 1000 accounts
        env:
          LOAD_RUN: ${{ inputs.run }}
          LOAD_PREPARED: ${{ inputs.prepared }}
          LOAD_UNTIL: ${{ inputs.until }}
          VENUE_LL_SIGN: ${{ secrets.VENUE_LL_SIGN }}
          VENUE_LL_ADMIN: ${{ secrets.VENUE_LL_ADMIN }}
          VENUE_LL_SERVICE: ${{ secrets.VENUE_LL_SERVICE }}
        run: node --max-old-space-size=512 cloud-load/driver/lowlat-producer.cjs
